<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>تسجيل الدخول | A5 Admin</title><link rel="stylesheet" href="/assets/css/admin.css"></head><body><main class="login-page"><section class="login-card"><div class="login-logo">A5</div><h1>مرحباً بعودتك</h1><p>سجّل الدخول للوصول إلى لوحة إدارة الموقع.</p><div id="message" aria-live="polite"></div><form id="login-form"><div class="field"><label for="email">البريد الإلكتروني الإداري</label><input id="email" type="email" autocomplete="username" required placeholder="name@example.com"></div><div class="field"><label for="password">كلمة المرور</label><input id="password" type="password" autocomplete="current-password" required minlength="8" placeholder="••••••••"></div><button class="btn" type="submit">تسجيل الدخول</button></form><div class="login-help">هذه الصفحة مخصصة للمسؤولين المعتمدين فقط. لا يوجد حساب افتراضي؛ يجب إنشاء المستخدم وإضافته إلى admin_profiles في Supabase أولاً.</div></section></main><script type="module">
import {signIn, getSession} from '/assets/js/admin-auth.js';
if(getSession()?.access_token) location.replace('/admin/index.html');
const form=document.getElementById('login-form'), msg=document.getElementById('message');
form.addEventListener('submit',async e=>{e.preventDefault();msg.innerHTML='';form.classList.add('loading');try{await signIn(document.getElementById('email').value.trim(),document.getElementById('password').value);location.replace('/admin/index.html')}catch(err){msg.innerHTML=`<div class="notice error">${String(err.message).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}</div>`}finally{form.classList.remove('loading')}});
</script></body></html>
