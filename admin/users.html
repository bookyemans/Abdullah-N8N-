<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة المستخدمين</title><link rel="stylesheet" href="/assets/css/admin.css"></head><body><main class="admin-container"><header><h1>إدارة حسابات الإدارة</h1><p>هذه الصفحة متاحة للمالك فقط.</p><a href="/admin/index.html">العودة للوحة التحكم</a></header><section class="admin-card"><h2>دعوة مستخدم</h2><form id="invite"><label>البريد الإلكتروني <input name="email" type="email" required maxlength="254"></label><label>الاسم <input name="displayName" maxlength="120"></label><label>الصلاحية <select name="role"><option value="admin">مدير</option><option value="owner">مالك</option></select></label><button type="submit">إرسال الدعوة</button></form><p id="notice" role="status"></p></section><section class="admin-card"><h2>الحسابات الحالية</h2><div id="users">جارٍ التحميل...</div></section></main><script type="module">
import {api,requireAdmin} from '/assets/js/admin-auth.js';
const $=s=>document.querySelector(s), notice=(m)=>$('#notice').textContent=m;
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function load(){const d=await api('/api/admin/users');$('#users').innerHTML=(d.users||[]).map(u=>`<article class="admin-card"><strong>${esc(u.display_name||u.user_id)}</strong><p>${esc(u.user_id)} · ${esc(u.role)} · ${u.is_active?'نشط':'معطل'}</p><label>الصلاحية <select data-role="${esc(u.user_id)}"><option value="admin" ${u.role==='admin'?'selected':''}>مدير</option><option value="owner" ${u.role==='owner'?'selected':''}>مالك</option></select></label><button data-save="${esc(u.user_id)}">حفظ الصلاحية</button><button data-active="${esc(u.user_id)}" data-value="${u.is_active?'false':'true'}">${u.is_active?'تعطيل':'تفعيل'}</button></article>`).join('')||'لا توجد حسابات.';}
$('#invite').addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.currentTarget);try{const d=await api('/api/admin/users',{method:'POST',body:JSON.stringify({email:f.get('email'),displayName:f.get('displayName'),role:f.get('role')})});notice(d.message);e.currentTarget.reset();await load()}catch(err){notice(err.message)}});
$('#users').addEventListener('click',async e=>{const id=e.target.dataset.save||e.target.dataset.active;if(!id)return;try{const payload=e.target.dataset.save?{role:document.querySelector(`[data-role="${CSS.escape(id)}"]`).value}:{isActive:e.target.dataset.value==='true'};await api(`/api/admin/users/${encodeURIComponent(id)}`,{method:'PATCH',body:JSON.stringify(payload)});notice('تم تحديث الحساب.');await load()}catch(err){notice(err.message)}});
try{const me=await requireAdmin();if(me.profile.role!=='owner')throw new Error('هذه الصفحة مخصصة للمالك.');await load()}catch(e){notice(e.message)}
</script></body></html>
