<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>الإعدادات | A5 Admin</title><link rel="stylesheet" href="/assets/css/admin.css"></head><body><div class="admin-shell" data-admin-layout><div class="empty">جارٍ التحقق من صلاحية الدخول...</div></div><script type="module">
import {initAdmin,showError,escapeHtml} from '/assets/js/admin-common.js';import {api} from '/assets/js/admin-auth.js';
try{
 const auth=await initAdmin('/admin/settings.html');const root=document.getElementById('admin-content');
 root.innerHTML=`<div id="notice" aria-live="polite"></div>
 <section class="card"><div class="section-head"><h2>مخزن الإعدادات السرية</h2><span id="vault-status" class="badge">جارٍ الفحص</span></div><div class="notice">تُحفظ مفاتيح الاتصال مشفرة باستخدام AES-GCM داخل Cloudflare KV. لن نعرض المفاتيح السرية مرة أخرى بعد الحفظ؛ الحقول الفارغة تعني الإبقاء على القيمة الحالية.</div><p class="muted" style="font-size:12px">يتطلب هذا القسم ربط KV باسم CONFIG_KV وإضافة CONFIG_ENCRYPTION_KEY في Cloudflare Pages قبل حفظ البيانات.</p></section>
 <section class="card" style="margin-top:18px"><div class="section-head"><h2>اتصال Supabase</h2><span id="supabase-state" class="badge">غير مفحوص</span></div><form id="supabase-form"><div class="grid two-col"><div class="field"><label for="sb-url">رابط المشروع</label><input id="sb-url" type="url" placeholder="https://project-ref.supabase.co" autocomplete="url"></div><div class="field"><label for="sb-anon">Publishable Key</label><input id="sb-anon" type="password" placeholder="اتركه فارغاً للإبقاء على المفتاح الحالي" autocomplete="new-password"></div><div class="field"><label for="sb-service">Secret Key (خادمي)</label><input id="sb-service" type="password" placeholder="مفتاح خادمي سري — لا يظهر للمتصفح" autocomplete="new-password"></div></div><div class="toolbar"><button class="btn" type="submit">حفظ إعدادات Supabase</button><button class="btn secondary" type="button" data-test="supabase">اختبار الاتصال</button></div></form><p class="muted" id="sb-hint" style="font-size:12px;margin-bottom:0"></p></section>
 <div class="grid two-col" style="margin-top:18px"><section class="card"><div class="section-head"><h2>بوت Telegram</h2><span id="telegram-state" class="badge">غير مفحوص</span></div><form id="telegram-form"><div class="field"><label for="tg-token">Bot Token</label><input id="tg-token" type="password" placeholder="أدخل الرمز أو اتركه فارغاً" autocomplete="new-password"></div><div class="field"><label for="tg-chat">Chat ID</label><input id="tg-chat" type="text" placeholder="مثال: 123456789"></div><div class="setting-row"><div><strong>تفعيل الإشعارات</strong><small>استخدام البوت لإرسال التنبيهات</small></div><input class="switch" type="checkbox" id="tg-enabled"></div><div class="toolbar" style="margin-top:16px"><button class="btn" type="submit">حفظ Telegram</button><button class="btn secondary" type="button" data-test="telegram">اختبار البوت</button></div></form></section>
 <section class="card"><div class="section-head"><h2>Google Sheets</h2><span id="sheets-state" class="badge">غير مفحوص</span></div><form id="sheets-form"><div class="field"><label for="gs-url">رابط Google Apps Script Web App</label><input id="gs-url" type="url" placeholder="https://script.google.com/macros/s/.../exec"></div><div class="field"><label for="gs-id">Spreadsheet ID</label><input id="gs-id" type="text" placeholder="معرّف جدول البيانات"></div><div class="setting-row"><div><strong>تفعيل المزامنة</strong><small>إرسال نسخة ثانوية بعد الحفظ في Supabase</small></div><input class="switch" type="checkbox" id="gs-enabled"></div><div class="toolbar" style="margin-top:16px"><button class="btn" type="submit">حفظ Google Sheets</button><button class="btn secondary" type="button" data-test="google_sheets">اختبار الاتصال</button></div></form></section></div>
 <section class="card" style="margin-top:18px"><div class="section-head"><h2>إعدادات التتبع</h2><span class="badge">المالك</span></div><div class="setting-row"><div><strong>تفعيل تتبع الموقع</strong><small>السماح بتسجيل أحداث الزيارات</small></div><input class="switch" type="checkbox" id="tracking-enabled"></div><div class="setting-row"><div><strong>تسجيل مشاهدات الصفحات</strong><small>تسجيل الصفحة التي تمت مشاهدتها</small></div><input class="switch" type="checkbox" id="pageviews-enabled"></div><div class="setting-row"><div><strong>تسجيل النقرات</strong><small>تسجيل أزرار التواصل والدعوات للإجراء</small></div><input class="switch" type="checkbox" id="clicks-enabled"></div><button class="btn" id="save-tracking" style="margin-top:18px">حفظ إعدادات التتبع</button></section>`;
 const n=document.getElementById('notice');
 if(auth.profile.role!=='owner'){document.querySelectorAll('#admin-content input,#admin-content button').forEach(x=>x.disabled=true);n.innerHTML='<div class="notice error">حسابك بصلاحية Admin للعرض فقط. تعديل الإعدادات متاح للمالك.</div>';throw new Error('owner_required')}
 const [connections,current]=await Promise.all([api('/api/admin/connections'),api('/api/admin/settings')]);
 document.getElementById('vault-status').textContent=connections.storageReady?'التخزين المشفر جاهز':'يلزم إعداد Cloudflare KV';
 document.getElementById('sb-url').value=connections.supabase.url||'';
 document.getElementById('sb-hint').textContent=connections.supabase.configured?`Publishable Key محفوظ: ${connections.supabase.publishableKey || connections.supabase.anonKey} — Secret Key: ${connections.supabase.secretKey || connections.supabase.serviceRoleKey}`:'لم يتم إعداد جميع بيانات Supabase بعد.';
 document.getElementById('supabase-state').textContent=connections.supabase.configured?'مُعد':'غير مكتمل';
 document.getElementById('telegram-state').textContent=connections.telegram.configured?'البيانات محفوظة':'غير مكتمل';
 document.getElementById('tg-chat').value=connections.telegram.chatId||'';document.getElementById('tg-enabled').checked=connections.telegram.enabled;
 document.getElementById('sheets-state').textContent=connections.google_sheets.configured?'البيانات محفوظة':'غير مكتمل';document.getElementById('gs-url').value=connections.google_sheets.appsScriptUrl||'';document.getElementById('gs-id').value=connections.google_sheets.spreadsheetId||'';document.getElementById('gs-enabled').checked=connections.google_sheets.enabled;
 const settings=Object.fromEntries((current.settings||[]).map(x=>[x.key,x.value]));const tracking=settings.tracking||{};document.getElementById('tracking-enabled').checked=tracking.enabled!==false;document.getElementById('pageviews-enabled').checked=tracking.pageviews!==false;document.getElementById('clicks-enabled').checked=tracking.clicks!==false;
 async function save(section,payload){try{const r=await api('/api/admin/connections',{method:'PUT',body:JSON.stringify({section,...payload})});n.innerHTML=`<div class="notice">${escapeHtml(r.message||'تم الحفظ بنجاح.')}</div>`;for(const id of ['sb-anon','sb-service','tg-token'])document.getElementById(id).value='';if(section!=='supabase')await refreshConnections();else document.getElementById('supabase-state').textContent='تم الحفظ — قد تحتاج لإعادة تسجيل الدخول';}catch(e){showError(n,e)}}
 async function refreshConnections(){const c=await api('/api/admin/connections');document.getElementById('vault-status').textContent=c.storageReady?'التخزين المشفر جاهز':'يلزم إعداد Cloudflare KV';document.getElementById('supabase-state').textContent=c.supabase.configured?'مُعد':'غير مكتمل';document.getElementById('sb-hint').textContent=c.supabase.configured?`Publishable Key محفوظ: ${c.supabase.publishableKey || c.supabase.anonKey} — Secret Key: ${c.supabase.secretKey || c.supabase.serviceRoleKey}`:'لم يتم إعداد جميع بيانات Supabase بعد.';document.getElementById('telegram-state').textContent=c.telegram.configured?'البيانات محفوظة':'غير مكتمل';document.getElementById('sheets-state').textContent=c.google_sheets.configured?'البيانات محفوظة':'غير مكتمل'}
 document.getElementById('supabase-form').addEventListener('submit',e=>{e.preventDefault();save('supabase',{url:document.getElementById('sb-url').value,publishableKey:document.getElementById('sb-anon').value,secretKey:document.getElementById('sb-service').value})});
 document.getElementById('telegram-form').addEventListener('submit',e=>{e.preventDefault();save('telegram',{botToken:document.getElementById('tg-token').value,chatId:document.getElementById('tg-chat').value,enabled:document.getElementById('tg-enabled').checked})});
 document.getElementById('sheets-form').addEventListener('submit',e=>{e.preventDefault();save('google_sheets',{appsScriptUrl:document.getElementById('gs-url').value,spreadsheetId:document.getElementById('gs-id').value,enabled:document.getElementById('gs-enabled').checked})});
 document.querySelectorAll('[data-test]').forEach(b=>b.addEventListener('click',async()=>{const section=b.dataset.test;try{const r=await api('/api/admin/connections',{method:'POST',body:JSON.stringify({section})});n.innerHTML=`<div class="notice">${escapeHtml(r.detail||'نجح الاختبار.')}</div>`;document.getElementById(section==='google_sheets'?'sheets-state':section==='telegram'?'telegram-state':'supabase-state').textContent='الاتصال ناجح'}catch(e){showError(n,e)}}));
 document.getElementById('save-tracking').addEventListener('click',async()=>{try{await api('/api/admin/settings',{method:'PUT',body:JSON.stringify({key:'tracking',value:{enabled:document.getElementById('tracking-enabled').checked,pageviews:document.getElementById('pageviews-enabled').checked,clicks:document.getElementById('clicks-enabled').checked}})});n.innerHTML='<div class="notice">تم حفظ إعدادات التتبع.</div>'}catch(e){showError(n,e)}});
}catch(e){if(e.message!=='owner_required')showError(document.getElementById('notice')||document.getElementById('admin-content')||document.querySelector('[data-admin-layout]'),e)}
</script></body></html>
