<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>لوحة الإدارة | A5</title><link rel="stylesheet" href="/assets/css/admin.css"></head><body><div class="admin-shell" data-admin-layout><div class="empty">جارٍ التحقق من صلاحية الدخول...</div></div><script type="module">
import {initAdmin,fmtNum,showError,escapeHtml} from '/assets/js/admin-common.js';import {api} from '/assets/js/admin-auth.js';
try{await initAdmin('/admin/index.html');const root=document.getElementById('admin-content');root.innerHTML=`<div class="grid stats"><article class="card"><div class="stat-label">مشاهدات الصفحات</div><div class="stat-value" id="views">—</div></article><article class="card"><div class="stat-label">الزوار الفريدون</div><div class="stat-value" id="visitors">—</div></article><article class="card"><div class="stat-label">نقرات واتساب</div><div class="stat-value" id="whatsapp">—</div></article><article class="card"><div class="stat-label">طلبات التواصل</div><div class="stat-value" id="contacts">—</div></article></div><div class="grid two-col"><section class="card"><div class="section-head"><h2>ملخص آخر 30 يوماً</h2><a class="btn secondary" href="/admin/analytics.html">عرض التحليلات</a></div><div id="daily-chart" class="chart"><div class="empty">جارٍ تحميل البيانات...</div></div></section><section class="card"><div class="section-head"><h2>روابط الإدارة</h2></div><div class="setting-row"><div><strong>إعدادات الموقع</strong><small>التحكم بالتتبع والتكاملات</small></div><a class="btn secondary" href="/admin/settings.html">فتح</a></div><div class="setting-row"><div><strong>قائمة الزوار</strong><small>آخر الزوار المسجلين</small></div><a class="btn secondary" href="/admin/visitors.html">فتح</a></div><div class="setting-row"><div><strong>التحليلات</strong><small>مصادر الزيارات والصفحات</small></div><a class="btn secondary" href="/admin/analytics.html">فتح</a></div></section></div><section class="card" style="margin-top:18px"><div class="section-head"><h2>أكثر الصفحات زيارة</h2></div><div class="table-wrap"><table><thead><tr><th>الصفحة</th><th>المشاهدات</th><th>الزوار</th></tr></thead><tbody id="top-pages"><tr><td colspan="3" class="muted">جارٍ التحميل...</td></tr></tbody></table></div></section>`;
const d=await api('/api/admin/analytics?days=30');const ev=d.event_counts||{};document.getElementById('views').textContent=fmtNum(d.daily.reduce((a,x)=>a+Number(x.page_views||0),0));document.getElementById('visitors').textContent=fmtNum(d.unique_visitors||0);document.getElementById('whatsapp').textContent=fmtNum(ev.whatsapp_click||0);document.getElementById('contacts').textContent=fmtNum(ev.contact_submit||0);const max=Math.max(1,...d.daily.map(x=>Number(x.page_views||0)));document.getElementById('daily-chart').innerHTML=d.daily.length?d.daily.slice(-14).map(x=>`<div class="bar-col"><div class="bar" title="${fmtNum(x.page_views)}" style="height:${Math.max(2,Number(x.page_views||0)/max*85)}%"></div><span class="bar-label">${new Date(x.day_utc).toLocaleDateString('ar',{day:'numeric',month:'numeric'})}</span></div>`).join(''):'<div class="empty">لا توجد بيانات بعد.</div>';document.getElementById('top-pages').innerHTML=d.top_pages.length?d.top_pages.slice(0,8).map(x=>`<tr><td>${escapeHtml(x.page_path)}</td><td>${fmtNum(x.page_views)}</td><td>${fmtNum(x.unique_visitors)}</td></tr>`).join(''):'<tr><td colspan="3" class="empty">لا توجد بيانات صفحات بعد.</td></tr>';
}catch(e){const el=document.getElementById('admin-content')||document.querySelector('[data-admin-layout]');showError(el,e)}
</script></body></html>
