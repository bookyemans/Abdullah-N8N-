<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>تحليلات الزوار | A5 Admin</title><link rel="stylesheet" href="/assets/css/admin.css"></head><body><div class="admin-shell" data-admin-layout><div class="empty">جارٍ التحقق من صلاحية الدخول...</div></div><script type="module">
import {initAdmin,fmtNum,showError,escapeHtml} from '/assets/js/admin-common.js';import {api} from '/assets/js/admin-auth.js';
try{
 await initAdmin('/admin/analytics.html');const root=document.getElementById('admin-content');
 root.innerHTML=`<div class="section-head"><div><h2>تحليل أداء الموقع</h2><p class="sub">تحليلات مجمعة من قاعدة Supabase، مع استبعاد حركة الإدارة.</p></div><div class="toolbar"><select id="range" class="field compact"><option value="7">آخر 7 أيام</option><option value="30" selected>آخر 30 يوماً</option><option value="90">آخر 90 يوماً</option></select><button class="btn secondary" id="refresh">تحديث البيانات</button></div></div><div id="notice"></div>
 <div class="grid stats" id="kpis"><article class="card"><div class="stat-label">الزوار الفريدون</div><div class="stat-value">—</div></article><article class="card"><div class="stat-label">مشاهدات الصفحات</div><div class="stat-value">—</div></article><article class="card"><div class="stat-label">الجلسات</div><div class="stat-value">—</div></article><article class="card"><div class="stat-label">نقرات واتساب</div><div class="stat-value">—</div></article></div>
 <section class="card"><div class="section-head"><h2>مشاهدات الصفحات يومياً</h2><span class="muted" id="period-label"></span></div><div id="chart" class="chart"><div class="empty">جارٍ التحميل...</div></div></section>
 <div class="grid two-col" style="margin-top:18px"><section class="card"><div class="section-head"><h2>أكثر الصفحات زيارة</h2></div><div class="table-wrap"><table><thead><tr><th>الصفحة</th><th>المشاهدات</th><th>زوار فريدون</th></tr></thead><tbody id="pages"></tbody></table></div></section><section class="card"><div class="section-head"><h2>مصادر الزيارات والحملات</h2></div><div class="table-wrap"><table><thead><tr><th>المصدر</th><th>الحملة</th><th>الزيارات</th></tr></thead><tbody id="sources"></tbody></table></div></section></div>
 <div class="grid two-col" style="margin-top:18px"><section class="card"><div class="section-head"><h2>التوزيع الجغرافي</h2></div><div id="countries" class="rank-list"></div></section><section class="card"><div class="section-head"><h2>الأجهزة المستخدمة</h2></div><div id="devices" class="rank-list"></div></section></div>
 <section class="card" style="margin-top:18px"><div class="section-head"><h2>أنواع الأحداث والتفاعلات</h2></div><div id="events" class="grid event-grid"></div></section>`;
 const number=(v)=>fmtNum(v);const empty='<div class="empty">لا توجد بيانات ضمن هذه الفترة.</div>';
 function rankRows(rows,key,label){if(!rows?.length)return empty;const max=Math.max(1,...rows.map(x=>Number(x.sessions||0)));return rows.map(x=>`<div class="rank-row"><span>${escapeHtml(x[key]||'غير معروف')}</span><div class="progress"><span style="width:${Math.max(2,Number(x.sessions||0)/max*100)}%"></span></div><strong>${number(x.sessions)}</strong></div>`).join('')}
 async function load(){const d=await api(`/api/admin/analytics?days=${document.getElementById('range').value}`);const counts=d.event_counts||{};document.getElementById('kpis').innerHTML=[[d.unique_visitors,'الزوار الفريدون'],[d.total_page_views,'مشاهدات الصفحات'],[d.sessions?.sessions_in_range||0,'الجلسات'],[counts.whatsapp_click||0,'نقرات واتساب']].map(([v,l])=>`<article class="card"><div class="stat-label">${l}</div><div class="stat-value">${number(v)}</div></article>`).join('');document.getElementById('period-label').textContent=`آخر ${number(d.range_days)} يوماً`;
 const daily=d.daily||[],max=Math.max(1,...daily.map(x=>Number(x.page_views||0)));document.getElementById('chart').innerHTML=daily.length?daily.slice(-90).map(x=>`<div class="bar-col"><div class="bar" style="height:${Math.max(2,Number(x.page_views||0)/max*85)}%" title="${number(x.page_views)} مشاهدة"></div><span class="bar-label">${new Date(x.day_utc).toLocaleDateString('ar',{day:'numeric',month:'numeric'})}</span></div>`).join(''):empty;
 document.getElementById('pages').innerHTML=(d.top_pages||[]).map(x=>`<tr><td>${escapeHtml(x.page_path)}</td><td>${number(x.page_views)}</td><td>${number(x.unique_visitors)}</td></tr>`).join('')||'<tr><td colspan="3" class="empty">لا توجد بيانات</td></tr>';
 document.getElementById('sources').innerHTML=(d.sources||[]).map(x=>`<tr><td>${escapeHtml(x.source)}</td><td>${escapeHtml(x.campaign)}</td><td>${number(x.events)}</td></tr>`).join('')||'<tr><td colspan="3" class="empty">لا توجد بيانات</td></tr>';
 document.getElementById('countries').innerHTML=rankRows(d.countries,'country','الدولة');document.getElementById('devices').innerHTML=rankRows(d.devices,'device','الجهاز');
 document.getElementById('events').innerHTML=Object.entries(counts).map(([k,v])=>`<article class="card"><div class="stat-label">${escapeHtml(k)}</div><div class="stat-value">${number(v)}</div></article>`).join('')||empty;
 }
 document.getElementById('range').addEventListener('change',()=>load().catch(e=>showError(document.getElementById('notice'),e)));document.getElementById('refresh').onclick=()=>load().catch(e=>showError(document.getElementById('notice'),e));await load();
}catch(e){showError(document.getElementById('admin-content')||document.querySelector('[data-admin-layout]'),e)}
</script></body></html>
