<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>الزوار | A5 Admin</title><link rel="stylesheet" href="/assets/css/admin.css"></head><body><div class="admin-shell" data-admin-layout><div class="empty">جارٍ التحقق من صلاحية الدخول...</div></div><script type="module">
import {initAdmin,fmtNum,showError,escapeHtml} from '/assets/js/admin-common.js';import {api} from '/assets/js/admin-auth.js';
try{
 await initAdmin('/admin/visitors.html');const root=document.getElementById('admin-content');root.innerHTML=`<div id="notice"></div><section class="card"><div class="section-head"><div><h2>سجل الزوار</h2><p class="sub">اختر زائراً لعرض جلساته وتسلسل الأحداث المسجل.</p></div><button class="btn secondary" id="refresh">تحديث</button></div><div class="filter-row"><input id="source-filter" class="field-input" placeholder="تصفية حسب مصدر الزيارة"><input id="since-filter" class="field-input" type="date" aria-label="من تاريخ"><input id="until-filter" class="field-input" type="date" aria-label="إلى تاريخ"><button class="btn" id="apply">تطبيق</button><button class="btn secondary" id="clear">مسح</button></div><div class="table-wrap"><table><thead><tr><th>معرف مستعار</th><th>أول زيارة</th><th>آخر زيارة</th><th>مصدر أول زيارة</th><th>صفحة الدخول</th><th>التفاصيل</th></tr></thead><tbody id="visitor-rows"><tr><td colspan="6" class="empty">جارٍ التحميل...</td></tr></tbody></table></div><div class="section-head" style="margin-top:16px"><button class="btn secondary" id="prev">السابق</button><span id="page-label" class="muted">صفحة 1</span><button class="btn secondary" id="next">التالي</button></div></section><section class="card detail-card" id="visitor-detail" hidden><div class="section-head"><div><h2>تفاصيل الزائر</h2><p class="sub" id="visitor-summary"></p></div><button class="btn secondary" id="close-detail">إغلاق</button></div><div class="detail-columns"><div><h3>الجلسات</h3><div id="session-list"></div></div><div><h3>آخر الأحداث</h3><div id="event-timeline" class="timeline"></div></div></div></section>`;
 let offset=0,filters={};async function load(){const p=new URLSearchParams({limit:'50',offset:String(offset),...filters});const d=await api(`/api/admin/visitors?${p}`);document.getElementById('visitor-rows').innerHTML=d.visitors.length?d.visitors.map(v=>`<tr><td><code>${escapeHtml(v.visitor_key)}</code></td><td>${new Date(v.first_seen_at).toLocaleString('ar')}</td><td>${new Date(v.last_seen_at).toLocaleString('ar')}</td><td>${escapeHtml(v.first_source||'مباشر / غير معروف')}</td><td>${escapeHtml(v.first_landing_path||'—')}</td><td><button class="btn secondary small" data-visitor="${escapeHtml(v.id)}">عرض الرحلة</button></td></tr>`).join(''):'<tr><td colspan="6" class="empty">لا يوجد زوار مطابقون.</td></tr>';document.getElementById('page-label').textContent=`صفحة ${fmtNum(offset/50+1)} — إجمالي ${fmtNum(d.total)}`;document.getElementById('prev').disabled=offset===0;document.getElementById('next').disabled=!d.has_more;document.querySelectorAll('[data-visitor]').forEach(b=>b.addEventListener('click',()=>showVisitor(b.dataset.visitor)))}
 async function showVisitor(id){const panel=document.getElementById('visitor-detail');panel.hidden=false;document.getElementById('visitor-summary').textContent='جارٍ تحميل الجلسات والأحداث...';panel.scrollIntoView({behavior:'smooth',block:'start'});try{const d=await api(`/api/admin/visitors/${encodeURIComponent(id)}`);document.getElementById('visitor-summary').textContent=`${d.visitor.visitor_key} • أول زيارة ${new Date(d.visitor.first_seen_at).toLocaleString('ar')} • آخر زيارة ${new Date(d.visitor.last_seen_at).toLocaleString('ar')}`;document.getElementById('session-list').innerHTML=d.sessions.length?d.sessions.map(s=>`<article class="session-item"><strong>${escapeHtml(s.landing_path||'/')}</strong><div class="muted">${new Date(s.started_at).toLocaleString('ar')}</div><div class="session-meta">${escapeHtml(s.source||'مباشر')} • ${escapeHtml(s.device_type||'جهاز غير معروف')} • ${escapeHtml(s.country||'دولة غير معروفة')}</div><div class="muted">آخر نشاط: ${new Date(s.last_activity_at).toLocaleString('ar')}</div></article>`).join(''):'<div class="empty">لا توجد جلسات.</div>';document.getElementById('event-timeline').innerHTML=d.events.length?d.events.map(e=>`<article class="timeline-item"><strong>${escapeHtml(e.event_type)}</strong><div>${escapeHtml(e.page_path)}</div><time>${new Date(e.occurred_at).toLocaleString('ar')}</time></article>`).join(''):'<div class="empty">لا توجد أحداث.</div>'}catch(e){showError(document.getElementById('visitor-summary'),e)}}
 document.getElementById('apply').onclick=()=>{filters={};const s=document.getElementById('source-filter').value.trim(),from=document.getElementById('since-filter').value,to=document.getElementById('until-filter').value;if(s)filters.source=s;if(from)filters.since=from;if(to)filters.until=to;offset=0;load().catch(e=>showError(document.getElementById('notice'),e))};document.getElementById('clear').onclick=()=>{['source-filter','since-filter','until-filter'].forEach(id=>document.getElementById(id).value='');filters={};offset=0;load().catch(e=>showError(document.getElementById('notice'),e))};document.getElementById('refresh').onclick=()=>load().catch(e=>showError(document.getElementById('notice'),e));document.getElementById('prev').onclick=()=>{offset=Math.max(0,offset-50);load().catch(e=>showError(document.getElementById('notice'),e))};document.getElementById('next').onclick=()=>{offset+=50;load().catch(e=>showError(document.getElementById('notice'),e))};document.getElementById('close-detail').onclick=()=>document.getElementById('visitor-detail').hidden=true;await load();
}catch(e){showError(document.getElementById('admin-content')||document.querySelector('[data-admin-layout]'),e)}
</script></body></html>
