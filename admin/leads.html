<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>العملاء المحتملون | A5 Admin</title><link rel="stylesheet" href="/assets/css/admin.css"></head><body><div class="admin-shell" data-admin-layout><div class="empty">جارٍ التحقق من صلاحية الدخول...</div></div><script type="module">
import {initAdmin,fmtNum,showError,escapeHtml} from '/assets/js/admin-common.js';import {api,getSession} from '/assets/js/admin-auth.js';
try{
 const auth=await initAdmin('/admin/leads.html');const root=document.getElementById('admin-content');
 root.innerHTML=`<div id="notice"></div><section class="grid stats lead-stats"><article class="card"><div class="stat-label">إجمالي الطلبات المعروضة</div><div class="stat-value" id="lead-total">—</div></article><article class="card"><div class="stat-label">طلبات جديدة</div><div class="stat-value" id="lead-new">—</div></article><article class="card"><div class="stat-label">قيد المتابعة</div><div class="stat-value" id="lead-progress">—</div></article><article class="card"><div class="stat-label">تم الرد عليها</div><div class="stat-value" id="lead-replied">—</div></article></section><section class="card"><div class="section-head"><div><h2>إدارة طلبات التواصل</h2><p class="sub">طلبات العملاء المحفوظة في Supabase، مع مصدرها وحالتها وسجل المتابعة.</p></div><div class="lead-actions"><button class="btn secondary" id="refresh">تحديث</button>${auth.profile.role==='owner'?'<button class="btn" id="export">تصدير CSV</button>':''}</div></div><div class="filter-row"><input id="search" class="field-input" placeholder="ابحث بالاسم أو البريد أو الخدمة"><select id="status" class="field-input"><option value="">كل الحالات</option><option value="new">جديد</option><option value="in_progress">قيد المتابعة</option><option value="replied">تم الرد</option><option value="closed">مغلق</option><option value="spam">غير مرغوب</option></select><input id="since" class="field-input" type="date" aria-label="من تاريخ"><input id="until" class="field-input" type="date" aria-label="إلى تاريخ"><button class="btn" id="apply">تطبيق</button><button class="btn secondary" id="clear">مسح</button></div><div class="table-wrap"><table><thead><tr><th>تاريخ الطلب</th><th>الاسم</th><th>الخدمة</th><th>مصدر العميل</th><th>الحالة</th><th>الإشعار</th><th>التفاصيل</th></tr></thead><tbody id="lead-rows"><tr><td colspan="7" class="empty">جارٍ تحميل الطلبات...</td></tr></tbody></table></div><div class="section-head" style="margin-top:16px"><button class="btn secondary" id="prev">السابق</button><span id="page-label" class="muted">صفحة 1</span><button class="btn secondary" id="next">التالي</button></div></section><section class="card lead-detail" id="lead-detail" hidden><div class="section-head"><div><h2>تفاصيل طلب التواصل</h2><p class="sub" id="lead-meta"></p></div><button class="btn secondary" id="close-detail">إغلاق</button></div><div id="lead-content"></div></section>`;
 const labels={new:'جديد',in_progress:'قيد المتابعة',replied:'تم الرد',closed:'مغلق',spam:'غير مرغوب'};let offset=0,filters={};
 const statusBadge=s=>`<span class="badge status-${escapeHtml(s)}">${labels[s]||escapeHtml(s)}</span>`;
 async function load(){const q=new URLSearchParams({limit:'30',offset:String(offset),...filters});const d=await api(`/api/admin/leads?${q}`);document.getElementById('lead-total').textContent=fmtNum(d.total);document.getElementById('lead-new').textContent=fmtNum(d.status_counts?.new);document.getElementById('lead-progress').textContent=fmtNum(d.status_counts?.in_progress);document.getElementById('lead-replied').textContent=fmtNum(d.status_counts?.replied);document.getElementById('lead-rows').innerHTML=d.leads.length?d.leads.map(l=>`<tr><td>${new Date(l.created_at).toLocaleString('ar')}</td><td><strong>${escapeHtml(l.name)}</strong><small class="table-sub">${escapeHtml(l.email)}</small></td><td>${escapeHtml(l.service||'—')}</td><td>${escapeHtml(l.referral_source||'غير محدد')}</td><td>${statusBadge(l.status)}</td><td>${l.delivery_status==='sent'?'<span class="badge">تم الإرسال</span>':l.delivery_status==='failed'?'<span class="badge status-spam">فشل</span>':'<span class="muted">غير مهيأ</span>'}</td><td><button class="btn secondary small" data-lead="${escapeHtml(l.id)}">فتح</button></td></tr>`).join(''):'<tr><td colspan="7" class="empty">لا توجد طلبات مطابقة.</td></tr>';document.getElementById('page-label').textContent=`صفحة ${fmtNum(offset/30+1)} — إجمالي ${fmtNum(d.total)}`;document.getElementById('prev').disabled=offset===0;document.getElementById('next').disabled=!d.has_more;document.querySelectorAll('[data-lead]').forEach(b=>b.addEventListener('click',()=>showLead(b.dataset.lead)));}
 async function showLead(id){const panel=document.getElementById('lead-detail');panel.hidden=false;document.getElementById('lead-content').innerHTML='<div class="empty">جارٍ تحميل التفاصيل...</div>';panel.scrollIntoView({behavior:'smooth',block:'start'});try{const d=await api(`/api/admin/leads/${encodeURIComponent(id)}`);const l=d.lead;document.getElementById('lead-meta').textContent=`${new Date(l.created_at).toLocaleString('ar')} • رقم الطلب ${l.submission_ref}`;document.getElementById('lead-content').innerHTML=`<div class="lead-detail-grid"><div><div class="lead-field"><span>الاسم</span><strong>${escapeHtml(l.name)}</strong></div><div class="lead-field"><span>البريد</span><a href="mailto:${escapeHtml(l.email)}">${escapeHtml(l.email)}</a></div><div class="lead-field"><span>الهاتف</span><a href="tel:${escapeHtml(l.phone||'')}">${escapeHtml(l.phone||'غير مذكور')}</a></div><div class="lead-field"><span>الشركة</span><strong>${escapeHtml(l.company||'غير مذكور')}</strong></div></div><div><div class="lead-field"><span>الخدمة</span><strong>${escapeHtml(l.service||'—')}</strong></div><div class="lead-field"><span>الميزانية</span><strong>${escapeHtml(l.budget||'غير محددة')}</strong></div><div class="lead-field"><span>مصدر العميل</span><strong>${escapeHtml(l.referral_source||'غير محدد')}</strong></div><div class="lead-field"><span>صفحة المصدر</span><strong>${escapeHtml(l.source_page||'—')}</strong></div></div></div><div class="lead-message"><strong>وصف المشروع</strong><p>${escapeHtml(l.message).replace(/\n/g,'<br>')}</p></div><div class="lead-edit-grid"><label class="field"><span>حالة الطلب</span><select id="edit-status" class="field-input">${Object.entries(labels).map(([v,t])=>`<option value="${v}" ${l.status===v?'selected':''}>${t}</option>`).join('')}</select></label><label class="field"><span>ملاحظات داخلية</span><textarea id="edit-note" class="field-input" rows="4" maxlength="3000" placeholder="أضف ملاحظات المتابعة...">${escapeHtml(l.admin_note||'')}</textarea></label></div><div class="section-head"><span class="muted">حالة إشعار البريد: ${escapeHtml(l.delivery_status||'غير معروف')}</span><button class="btn" id="save-lead">حفظ التغييرات</button></div><div id="detail-notice" aria-live="polite"></div>`;document.getElementById('save-lead').onclick=async()=>{const button=document.getElementById('save-lead');button.disabled=true;try{await api(`/api/admin/leads/${encodeURIComponent(id)}`,{method:'PATCH',body:JSON.stringify({status:document.getElementById('edit-status').value,admin_note:document.getElementById('edit-note').value})});document.getElementById('detail-notice').innerHTML='<div class="notice">تم حفظ التغييرات.</div>';await load()}catch(e){showError(document.getElementById('detail-notice'),e)}finally{button.disabled=false}};}catch(e){showError(document.getElementById('lead-content'),e)}}
 document.getElementById('apply').onclick=()=>{filters={};for(const [id,key] of [['search','q'],['status','status'],['since','since'],['until','until']]){const v=document.getElementById(id).value.trim();if(v)filters[key]=v}offset=0;load().catch(e=>showError(document.getElementById('notice'),e))};document.getElementById('clear').onclick=()=>{['search','status','since','until'].forEach(id=>document.getElementById(id).value='');filters={};offset=0;load().catch(e=>showError(document.getElementById('notice'),e))};document.getElementById('refresh').onclick=()=>load().catch(e=>showError(document.getElementById('notice'),e));document.getElementById('prev').onclick=()=>{offset=Math.max(0,offset-30);load().catch(e=>showError(document.getElementById('notice'),e))};document.getElementById('next').onclick=()=>{offset+=30;load().catch(e=>showError(document.getElementById('notice'),e))};document.getElementById('close-detail').onclick=()=>document.getElementById('lead-detail').hidden=true;
 const exportBtn=document.getElementById('export');if(exportBtn)exportBtn.onclick=async()=>{try{const session=getSession();const r=await fetch('/api/admin/leads?format=csv',{headers:{Authorization:`Bearer ${session.access_token}`}});if(!r.ok)throw new Error('تعذر تصدير البيانات');const blob=await r.blob(),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='a5-leads.csv';a.click();URL.revokeObjectURL(url)}catch(e){showError(document.getElementById('notice'),e)}};
 await load();
}catch(e){showError(document.getElementById('admin-content')||document.querySelector('[data-admin-layout]'),e)}
</script></body></html>
